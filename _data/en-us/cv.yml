- title: Research Experience
  type: time_table
  contents:
    - title: Charged Hazes in Exoplanet Atmospheres
      institution: The University of Tokyo
      year: 2025 - 2026
      description:
        - "<b>Supervisors:</b> Shota Notsu and Kazumasa Ohno"
        - Investigated how electrostatic charging affects haze growth and transmission spectra in exoplanet atmospheres.

    - title: Tidal Dissipation in Asynchronous Planetary Systems
      institution: The University of Tokyo
      year: 2024 - Present
      description:
        - "<b>Supervisors:</b> Takato Tokuno and Akihiko Fukui"
        - Constraining stellar tidal dissipation using the orbital and rotational evolution of close-in planetary systems.

    - title: Semiconvection in Gas Giants
      institution: Princeton University
      year: 2024
      description:
        - "<b>Supervisors:</b> Yubo Su, Ankan Sur, and Adam Burrows"
        - Studied the evolution of semiconvective regions in giant planets using hydrodynamical simulations.

    - title: Supermassive Black Holes and Host Galaxies
      institution: Max Planck Institute for Extraterrestrial Physics
      year: 2025
      description:
        - "<b>Supervisor:</b> Taro Shimizu and Linda Tacconi"
        - Estimated galaxy and black-hole masses through spectral energy distribution fitting and related analyses.

    - title: Orbital Decay of TOI-263b
      institution: The University of Tokyo
      year: 2022 - 2023
      description:
        - "<b>Supervisors:</b> Akihiko Fukui and Norio Narita"
        - Searched for orbital decay using TESS and ground-based transit observations.


